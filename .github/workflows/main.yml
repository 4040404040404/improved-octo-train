  # Final step of the chain: kick off the next round of the whole sequence.
  # Delete this job (or set `if: never()`) to run the list only once per trigger.
  retrigger-next-round:
    name: 'Re-trigger next round on completion'
    needs: site-10-colorful-tv
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Next Job Automatically on Completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF_FILE=$(echo "$GITHUB_WORKFLOW_REF" | sed -E 's|.*/workflows/([^@]+)@.*|\1|')
          echo "Re-triggering $WF_FILE"
          gh workflow run "$WF_FILE" --ref "${{ github.ref_name }}"
