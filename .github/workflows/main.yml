name: Playwright Continuous Automation

# ---------------------------------------------------------------------------
# Runs run-finale.js against a fixed list of target sites, ONE BY ONE.
# Each site gets its own independent job (fresh runner) and the jobs are
# chained sequentially with `needs` so they execute in the order below:
#
#   01 zealous-river-220556.puter.site   -> stops fully on 02
#   02 witty-snake-472744.puter.site     -> stops fully on 03
#   03 kind-street-188208.puter.site     -> stops fully on 04
#   04 honest-bee-81788.puter.site       -> stops fully on 05
#   05 victorious-square-662213.puter.site -> stops fully on 06
#   06 relaxed-crab-648834.puter.site    -> stops fully on 07
#   07 smart-mountain-937000.puter.site  -> stops fully on 08
#   08 avid-mountain-909877.puter.site   -> stops fully on 09
#   09 jolly-road-702644.puter.site      -> stops fully on 10
#   10 colorful-tv-258268.puter.site     -> last site: no next url, stops on itself
#
# EVERY job stops itself: as soon as the browser reaches the NEXT site of the
# chain, the script logs
#   "[Playwright] Reached <next url> (<current url>) -> Stopping the whole script fully!"
# then "Browser disconnected. Exiting script." and exits 0 - the job no longer
# sits until `timeout-minutes`. The next site is derived automatically from the
# SITE_CHAIN order in run-finale.js (same order as the jobs below); the last
# site keeps the previous self-stop behavior. Override it when needed with a
# `STOP_HOSTS: 'host-a,host-b'` env var on the run step.
#
# Jobs are INDEPENDENT: every job carries `if: always()`, so a failure or a
# timeout in one site never blocks the next one in the chain.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

  schedule:
    - cron: '*/30 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: playwright-continuous-runner
  cancel-in-progress: false

jobs:
  site-01-zealous-river:
    name: '01 - zealous-river-220556.puter.site'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Script - zealous-river-220556.puter.site (Xvfb virtual display for headed mode)
        env:
          TARGET_URL: 'https://zealous-river-220556.puter.site'
        run: |
          echo "Target URL: $TARGET_URL"
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node run-finale.js "$TARGET_URL"

  site-02-witty-snake:
    name: '02 - witty-snake-472744.puter.site'
    needs: site-01-zealous-river
